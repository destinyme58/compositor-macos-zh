name: Verify macOS Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  checksum:
    name: Verify DMG checksum
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p artifacts
          for attempt in 1 2 3 4 5 6; do
            if gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir artifacts \
              --clobber; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify SHA-256 and package type
        working-directory: artifacts
        run: |
          test -n "$(find . -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find . -maxdepth 1 -name '*.sha256' -print -quit)"
          shasum -a 256 -c ./*.sha256
          file ./*.dmg

      - name: Upload verification record
        uses: actions/upload-artifact@v7
        with:
          name: release-checksum-${{ steps.release.outputs.tag }}
          path: artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

